name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  # ============================================================
  # 1 & 2. Build + Test (GCC and Clang, ASan/UBSan + TSan)
  # ============================================================
  build-test:
    name: Build (${{ matrix.compiler }}, ${{ matrix.sanitizer }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc-13
            cxx: g++-13
            sanitizer: none
          - compiler: gcc
            cc: gcc-13
            cxx: g++-13
            sanitizer: address
          - compiler: gcc
            cc: gcc-13
            cxx: g++-13
            sanitizer: thread
          - compiler: clang
            cc: clang-17
            cxx: clang++-17
            sanitizer: none
          - compiler: clang
            cc: clang-17
            cxx: clang++-17
            sanitizer: address

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build \
            gcc-13 g++-13 \
            clang-17 clang-tidy-17 \
            libssl-dev zlib1g-dev \
            git

      - name: Configure
        env:
          CC:  ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          SANITIZE_ARG=""
          if [ "${{ matrix.sanitizer }}" != "none" ]; then
            SANITIZE_ARG="-DSANITIZE=${{ matrix.sanitizer }}"
          fi
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -GNinja \
            $SANITIZE_ARG

      - name: Build
        run: cmake --build build --parallel $(nproc)

      - name: Test
        run: |
          ctest --test-dir build \
            --output-on-failure \
            --timeout 120

  # ============================================================
  # 3. Benchmark performance gate
  # Fail if p99 tick-to-signal regresses more than 20% vs baseline
  # ============================================================
  bench:
    name: Benchmark regression gate
    runs-on: ubuntu-24.04
    needs: build-test

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-13 g++-13 libssl-dev zlib1g-dev git

      - name: Build (Release, no sanitizers)
        env:
          CC: gcc-13
          CXX: g++-13
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -GNinja
          cmake --build build --parallel $(nproc)

      - name: Run benchmark
        run: |
          ./build/marketpulse --bench tests/fixtures/btcusdt_clean.jsonl 2>&1 | tee /tmp/bench_output.txt

      - name: Check regression vs baseline
        run: |
          python3 - << 'EOF'
          import json
          import re
          import sys

          with open("/tmp/bench_output.txt") as f:
              output = f.read()

          # Extract total p99 from output
          # Line format: "  total    NNNN   NNNN    NNNN    NNNN"
          m = re.search(r"total\s+(\d+)\s+(\d+)\s+(\d+)\s+(\d+)", output)
          if not m:
              print("ERROR: Could not parse benchmark output")
              sys.exit(1)

          p99_ns = int(m.group(2))
          print(f"Measured p99 tick-to-signal: {p99_ns} ns")

          # Load baseline
          baseline_path = "perf_baseline.json"
          try:
              with open(baseline_path) as f:
                  baseline = json.load(f)
              baseline_p99 = baseline["total_p99_ns"]
              threshold = baseline_p99 * 1.20  # 20% regression limit
              print(f"Baseline p99: {baseline_p99} ns  (20% threshold: {threshold:.0f} ns)")
              if p99_ns > threshold:
                  print(f"REGRESSION: {p99_ns} ns > {threshold:.0f} ns")
                  sys.exit(1)
              else:
                  print(f"OK: {p99_ns} ns <= {threshold:.0f} ns")
          except FileNotFoundError:
              print(f"WARNING: No baseline file at {baseline_path}")
              print("Commit perf_baseline.json after the first bench run to enable regression gate.")
              # Write baseline for this run
              baseline = {"total_p99_ns": p99_ns, "note": "generated by CI"}
              print(f"Suggested baseline: {json.dumps(baseline)}")
          EOF

  # ============================================================
  # 4. Formatting (clang-format) and static analysis (clang-tidy)
  # ============================================================
  lint:
    name: Lint (clang-format + clang-tidy)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-17 clang-tidy-17 \
            cmake ninja-build gcc-13 g++-13 libssl-dev zlib1g-dev git

      - name: clang-format check
        run: |
          find include src tests tools \
            -name "*.cpp" -o -name "*.hpp" | \
            xargs clang-format-17 --dry-run --Werror

      - name: Generate compile_commands.json
        env:
          CC: gcc-13
          CXX: g++-13
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -GNinja \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: clang-tidy
        run: |
          find include src -name "*.cpp" | \
            xargs clang-tidy-17 -p build --warnings-as-errors="*" 2>&1 | head -100

  # ============================================================
  # 5. ARM64 Docker image build
  # ============================================================
  docker:
    name: Docker build (linux/arm64)
    runs-on: ubuntu-24.04
    needs: build-test

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (for aarch64 cross-build)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (linux/arm64)
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --file Dockerfile \
            --tag marketpulse:ci \
            --load \
            .
